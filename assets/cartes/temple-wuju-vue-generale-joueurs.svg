<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17201d"/>
      <stop offset="1" stop-color="#0d1412"/>
    </linearGradient>
    <linearGradient id="jade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dfece4"/>
      <stop offset="1" stop-color="#b8d7c4"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
