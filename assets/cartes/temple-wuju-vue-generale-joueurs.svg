  <path d="M430 827 Q515 787 600 827 Q685 787 770 827" fill="none" stroke="#7fa898" stroke-width="7"/>
  <text x="600" y="866" text-anchor="middle" font-family="Georgia,serif" font-size="26" fill="#cfe0d7">Grottes des esprits — connexion naturelle vers l'extérieur</text>
