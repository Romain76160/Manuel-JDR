    <text x="230" y="238" font-family="Arial,sans-serif" font-size="22" fill="#304b3e">Dojo • Grande cloche • Accès au niveau intermédiaire</text>
    <circle cx="890" cy="208" r="48" fill="#78bca8" opacity=".78"/>
    <path d="M865 230 Q890 160 915 230" fill="none" stroke="#416b5d" stroke-width="6"/>
  </g>

  <path d="M600 305 L600 358" stroke="#d8e5dd" stroke-width="12" stroke-linecap="round"/>
  <path d="M580 343 L600 363 L620 343" fill="none" stroke="#d8e5dd" stroke-width="10"/>

  <g filter="url(#shadow)">
    <rect x="190" y="365" width="820" height="190" rx="28" fill="#d7e4dc" stroke="#789889" stroke-width="5"/>
    <text x="230" y="410" font-family="Georgia,serif" font-size="30" font-weight="bold" fill="#263b32">Niveau intermédiaire — Quartiers</text>
    <text x="230" y="452" font-family="Arial,sans-serif" font-size="22" fill="#385044">Dortoirs • Cloître intérieur • Bibliothèque • Soins</text>
    <text x="230" y="488" font-family="Arial,sans-serif" font-size="22" fill="#385044">Salles communes • Point de départ des PJ</text>
    <rect x="848" y="413" width="84" height="74" rx="12" fill="#9bc4ae"/>
    <path d="M864 430 h52 M864 448 h52 M864 466 h52" stroke="#4d7160" stroke-width="6"/>
  </g>

  <path d="M600 555 L600 608" stroke="#d8e5dd" stroke-width="12" stroke-linecap="round"/>
  <path d="M580 593 L600 613 L620 593" fill="none" stroke="#d8e5dd" stroke-width="10"/>

  <g filter="url(#shadow)">
    <rect x="190" y="615" width="820" height="170" rx="28" fill="#cbdad2" stroke="#698d7d" stroke-width="5"/>
    <text x="230" y="660" font-family="Georgia,serif" font-size="30" font-weight="bold" fill="#23372f">Niveau inférieur — Reliquaire</text>
    <text x="230" y="702" font-family="Arial,sans-serif" font-size="22" fill="#354b41">Reliquaire • Chambre des esprits • Alcôves mémorielles</text>
    <text x="230" y="738" font-family="Arial,sans-serif" font-size="22" fill="#354b41">Accès naturel vers les Grottes des esprits</text>
